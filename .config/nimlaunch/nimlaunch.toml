# Curated NimLaunch configuration for the Niri desktop.

[window]
width = 500
opacity = 1.0
max_visible_items = 10
center = true
position_x = 20
position_y = 500
vertical_align = "one-third"
display = 0

[font]
fontname = "JetBrainsMono Nerd Font:size=16"

[input]
prompt = "> "
cursor = "_"
vim_mode = false

[terminal]
program = "kitty"

[border]
width = 2

[icons]
enabled = true

# Web searches
[[shortcuts]]
prefix = ":g"
label = "Search Google: "
base = "https://www.google.com/search?q={query}"
mode = "url"

[[shortcuts]]
prefix = ":w"
label = "Search Wikipedia: "
base = "https://en.wikipedia.org/wiki/Special:Search?search={query}"
mode = "url"

[[shortcuts]]
prefix = ":y"
label = "Search YouTube: "
base = "https://www.youtube.com/results?search_query={query}"
mode = "url"

[[shortcuts]]
prefix = ":gh"
label = "Search GitHub: "
base = "https://github.com/search?q={query}&type=code"
mode = "url"

[[shortcuts]]
prefix = ":aw"
label = "Search Arch Wiki: "
base = "https://wiki.archlinux.org/index.php?search={query}"
mode = "url"

[[shortcuts]]
prefix = ":man"
label = "Search manual pages: "
base = "https://man.archlinux.org/search?q={query}"
mode = "url"

# Filter and pass-through groups
[[groups]]
name = "sys"
query_mode = "filter"

[[groups]]
name = "svc"
query_mode = "pass"

[[groups]]
name = "docs"
query_mode = "filter"

[[groups]]
name = "ss"
query_mode = "filter"

[[groups]]
name = "places"
query_mode = "filter"

[[groups]]
name = "cheats"
query_mode = "filter"

[[groups]]
name = "scripts"
query_mode = "filter"

# Service inspection
[[shortcuts]]
group = "svc"
label = "systemctl status: "
base = "systemctl status {query}"
mode = "shell"
run_mode = "terminal"

[[shortcuts]]
group = "svc"
label = "systemctl show: "
base = "systemctl show {query}"
mode = "shell"
run_mode = "terminal"

[[shortcuts]]
group = "svc"
label = "journalctl for this boot: "
base = "journalctl -u {query} -b"
mode = "shell"
run_mode = "terminal"

[[shortcuts]]
group = "svc"
label = "journalctl recent errors: "
base = "journalctl -u {query} -xe"
mode = "shell"
run_mode = "terminal"

# Documentation
[[shortcuts]]
group = "docs"
label = "Nim language documentation"
base = "https://nim-lang.org/docs/"
mode = "url"

[[shortcuts]]
group = "docs"
label = "Go package documentation"
base = "https://pkg.go.dev/"
mode = "url"

[[shortcuts]]
group = "docs"
label = "Python documentation"
base = "https://docs.python.org/3/"
mode = "url"

[[shortcuts]]
group = "docs"
label = "Free Pascal documentation"
base = "https://www.freepascal.org/docs.html"
mode = "url"

# Local cheatsheets
[[shortcuts]]
group = "cheats"
label = "Helix keybindings"
base = "exec \"$HOME/.local/bin/helix-cheatsheet\""
mode = "shell"
run_mode = "terminal"
stay_open = false

[[shortcuts]]
group = "cheats"
label = "Kitty shortcuts"
base = "exec \"$HOME/.local/bin/kitty-cheatsheet\""
mode = "shell"
run_mode = "terminal"
stay_open = false

# Screenshots
[[shortcuts]]
group = "ss"
label = "Screenshot area to clipboard"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_screenshot.sh area clipboard"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "ss"
label = "Screenshot area to file"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_screenshot.sh area save"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "ss"
label = "Full screenshot to clipboard"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_screenshot.sh full clipboard"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "ss"
label = "Full screenshot to file"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_screenshot.sh full save"
mode = "shell"
run_mode = "spawn"
stay_open = false

# Desktop integrations
[[shortcuts]]
prefix = ":m"
label = "Calculate: "
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_calculator.sh {query}"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "scripts"
label = "Audio output"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_audio.sh"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "scripts"
label = "Window switcher"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_windows.sh"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "scripts"
label = "Clipboard history"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_clipboard.sh"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "scripts"
label = "Wi-Fi networks"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_wifi.sh"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "scripts"
label = "Bluetooth devices"
base = "$HOME/.config/nimlaunch/scripts/nimlaunch_bluetooth.sh"
mode = "shell"
run_mode = "spawn"
stay_open = false

# Session actions
[[shortcuts]]
group = "sys"
label = "Lock session"
base = "gtklock"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "sys"
label = "Suspend system"
base = "systemctl suspend"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "sys"
label = "Log out of Niri"
base = "niri msg action quit --skip-confirmation"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "sys"
label = "Reboot system"
base = "systemctl reboot"
mode = "shell"
run_mode = "spawn"
stay_open = false

[[shortcuts]]
group = "sys"
label = "Shut down system"
base = "systemctl poweroff"
mode = "shell"
run_mode = "spawn"
stay_open = false

# Portable locations
[[shortcuts]]
group = "places"
label = "Home"
base = "~/"
mode = "file"

[[shortcuts]]
group = "places"
label = "Documents"
base = "~/Documents"
mode = "file"

[[shortcuts]]
group = "places"
label = "Downloads"
base = "~/Downloads"
mode = "file"

[[shortcuts]]
group = "places"
label = "Projects"
base = "~/Projects"
mode = "file"

